# Builds the app on every push to main and publishes it with GitHub Pages.
#
# Where: the repository variable SITE_REPO (default neokrex-source/junctionnav). When that is this
# repository, the site is deployed here (Settings → Pages → Source: "GitHub Actions"). When it is
# another one (this source repository private, the site public, see Publishing in the README), the
# site goes to that repository's gh-pages branch and its front page to main, written with the
# SITE_TOKEN secret, and GitHub Pages there serves gh-pages.
#
# The offline maps (built by offline-pack.yml and kept in the Actions cache) are published with
# the site under offline/, and the places data (places.yml) under places/. When either has a new
# build ready, its workflow starts this one again.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_REPO: ${{ vars.SITE_REPO || 'neokrex-source/junctionnav' }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      split: ${{ steps.where.outputs.split }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Where the site is published
        id: where
        run: |
          echo "SITE_OWNER=${SITE_REPO%%/*}" >> "$GITHUB_ENV"
          echo "SITE_NAME=${SITE_REPO##*/}" >> "$GITHUB_ENV"
          if [ "${SITE_REPO,,}" = "${GITHUB_REPOSITORY,,}" ]; then echo "split=false" >> "$GITHUB_OUTPUT"; else echo "split=true" >> "$GITHUB_OUTPUT"; fi
      - run: npm run build
        env:
          # Optional: set these as repository variables (Settings → Secrets and variables → Actions → Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # The Android installer published by the Android app workflow, linked from Settings.
          VITE_APK_URL: https://github.com/${{ env.SITE_REPO }}/releases/download/android/JunctionNav.apk
          # This site, for the Android app's website mode (downloaded into the app, see src/native/appMode.ts).
          VITE_WEB_APP_URL: https://${{ env.SITE_OWNER }}.github.io/${{ env.SITE_NAME }}/
          VITE_AUTH_REQUIRED: ${{ vars.VITE_AUTH_REQUIRED }}
          # Traffic headlines collected by the Traffic news workflow (no key needed).
          VITE_TRAFFIC_NEWS_URL: https://raw.githubusercontent.com/${{ env.SITE_REPO }}/traffic-news/news.json
          # Optional: a TomTom key for everyone (each user can also paste their own in Settings).
          VITE_TOMTOM_KEY: ${{ vars.VITE_TOMTOM_KEY }}

      # ---- offline maps: the newest pack in the cache
      - uses: actions/cache/restore@v4
        with:
          path: offline-pack
          key: offline-pack-v1-newest
          restore-keys: offline-pack-v1-
      - name: Add offline maps to the site
        run: |
          if [ -f offline-pack/manifest.json ]; then
            cp -r offline-pack dist/offline
            du -sh dist/offline
            node -e 'const m=require("./offline-pack/manifest.json");const mb=(n)=>(n/1048576).toFixed(1);const dl=m.files.reduce((a,f)=>a+f.parts.reduce((b,p)=>b+p.size,0),0);console.log(`::notice title=Offline maps published::${m.name}, built ${m.built.slice(0,10)}: ${m.files.map((f)=>`${f.name} ${mb(f.size)} MB`).join(", ")}; download ${mb(dl)} MB`)'
          else
            echo "::notice::No offline maps yet; the site is published without them (see the Offline maps workflow)."
          fi
          du -sh dist

      # ---- places around you: the newest build in the cache (see the Places workflow)
      - uses: actions/cache/restore@v4
        with:
          path: places-data
          key: places-v1-newest
          restore-keys: places-v1-
      - name: Add the places data to the site
        run: |
          if [ -f places-data/manifest.json ]; then
            cp -r places-data dist/places
            du -sh dist/places
            node -e 'const m=require("./places-data/manifest.json");console.log(`::notice title=Places published::${m.count} places in ${Object.keys(m.cells).length} cells, built ${m.built.slice(0,10)} (Overture ${m.sources.overture}, OSM ${m.sources.osm})`)'
          else
            echo "::notice::No places data yet; the site is published without it (see the Places workflow)."
          fi
          du -sh dist

      # ---- a separate public site repository: the site on gh-pages, its front page on main
      - name: Publish to the public site repository
        if: steps.where.outputs.split == 'true'
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          touch dist/.nojekyll
          scripts/site/publish.sh dist gh-pages "Site from ${GITHUB_SHA::7}"
          mkdir -p front && cp scripts/site/public/README.md front/
          scripts/site/publish.sh front main "Front page from ${GITHUB_SHA::7}"
          echo "::notice title=Published::https://${SITE_OWNER}.github.io/${SITE_NAME}/ from ${SITE_REPO} (gh-pages)"

      # ---- or this repository's own GitHub Pages
      - uses: actions/configure-pages@v5
        if: steps.where.outputs.split != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.where.outputs.split != 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.split != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
