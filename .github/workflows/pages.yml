# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The offline maps (built by offline-pack.yml and kept in the Actions cache) are published with
# the site under offline/, and the places data (places.yml) under places/. When either has a new
# build ready, its workflow starts this one again.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional: set these as repository variables (Settings → Secrets and variables → Actions → Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # The Android installer published by the Android app workflow, linked from Settings.
          VITE_APK_URL: https://github.com/${{ github.repository }}/releases/download/android/JunctionNav.apk
          # This site, for the Android app's website mode (downloaded into the app, see src/native/appMode.ts).
          VITE_WEB_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VITE_AUTH_REQUIRED: ${{ vars.VITE_AUTH_REQUIRED }}
          # Traffic headlines collected by the Traffic news workflow (no key needed).
          VITE_TRAFFIC_NEWS_URL: https://raw.githubusercontent.com/${{ github.repository }}/traffic-news/news.json
          # Optional: a TomTom key for everyone (each user can also paste their own in Settings).
          VITE_TOMTOM_KEY: ${{ vars.VITE_TOMTOM_KEY }}

      # ---- offline maps: the newest pack in the cache
      - uses: actions/cache/restore@v4
        with:
          path: offline-pack
          key: offline-pack-v1-newest
          restore-keys: offline-pack-v1-
      - name: Add offline maps to the site
        run: |
          if [ -f offline-pack/manifest.json ]; then
            cp -r offline-pack dist/offline
            du -sh dist/offline
            node -e 'const m=require("./offline-pack/manifest.json");const mb=(n)=>(n/1048576).toFixed(1);const dl=m.files.reduce((a,f)=>a+f.parts.reduce((b,p)=>b+p.size,0),0);console.log(`::notice title=Offline maps published::${m.name}, built ${m.built.slice(0,10)}: ${m.files.map((f)=>`${f.name} ${mb(f.size)} MB`).join(", ")}; download ${mb(dl)} MB`)'
          else
            echo "::notice::No offline maps yet; the site is published without them (see the Offline maps workflow)."
          fi
          du -sh dist

      # ---- places around you: the newest build in the cache (see the Places workflow)
      - uses: actions/cache/restore@v4
        with:
          path: places-data
          key: places-v1-newest
          restore-keys: places-v1-
      - name: Add the places data to the site
        run: |
          if [ -f places-data/manifest.json ]; then
            cp -r places-data dist/places
            du -sh dist/places
            node -e 'const m=require("./places-data/manifest.json");console.log(`::notice title=Places published::${m.count} places in ${Object.keys(m.cells).length} cells, built ${m.built.slice(0,10)} (Overture ${m.sources.overture}, OSM ${m.sources.osm})`)'
          else
            echo "::notice::No places data yet; the site is published without it (see the Places workflow)."
          fi
          du -sh dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
