# Collects traffic headlines from Malaysian news feeds every 20 minutes into news.json on the
# traffic-news branch of the site repository (SITE_REPO: this one, or the public one when this
# source is private, written with the SITE_TOKEN secret), which the app reads (no key needed).
# One commit, replaced each run.
name: Traffic news

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/traffic/**'
      - 'src/traffic/roads.ts'
      - 'scripts/site/publish.sh'
      - '.github/workflows/traffic-news.yml'

permissions:
  contents: write

concurrency:
  group: traffic-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the collector
        run: node --experimental-strip-types --test scripts/traffic/news.test.mjs
      - name: Collect
        run: node --experimental-strip-types scripts/traffic/news.mjs out/news.json
      - name: Publish to the traffic-news branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_REPO: ${{ vars.SITE_REPO || 'neokrex-source/junctionnav' }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: scripts/site/publish.sh out traffic-news "Traffic news $(date -u +%Y-%m-%dT%H:%MZ)"
