<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>JunctionNav</title>
    <meta name="description" content="Turn-by-turn navigation with junction views for ramps, forks, exits and divider splits." />
    <meta name="theme-color" content="#0b6b45" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Splash: shown by the HTML itself so it appears before the app code loads. */
      #splash {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-content: center; justify-items: center; gap: 14px;
        padding: 24px; text-align: center;
        background: #0b6b45; color: #fff;
        font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      @media (prefers-color-scheme: dark) { #splash { background: #0a5236; } }
      #splash.is-done { opacity: 0; visibility: hidden; }
      #splash .sp-mark { width: 132px; height: 132px; overflow: visible; }
      #splash .sp-mark path { fill: none; stroke: #fff; stroke-width: 56; stroke-linecap: round; stroke-linejoin: round; }
      #splash .sp-trunk, #splash .sp-other, #splash .sp-taken { stroke-dasharray: 260; stroke-dashoffset: 260; animation: sp-draw 0.55s ease-out forwards; }
      #splash .sp-other { stroke-opacity: 0.45; animation-delay: 0.45s; }
      #splash .sp-taken { animation-delay: 0.45s; }
      #splash .sp-head { fill: #fff; opacity: 0; transform-origin: 360px 160px; animation: sp-pop 0.3s 0.95s ease-out forwards; }
      #splash .sp-name { font: 700 46px/1 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; letter-spacing: 0.01em; margin-top: 6px; }
      #splash .sp-tag { font-size: 16px; font-weight: 500; opacity: 0.86; max-width: 30ch; }
      /* Lane markings sliding past while the app loads. */
      #splash .sp-lane {
        width: 132px; height: 6px; margin-top: 18px; border-radius: 3px;
        background: repeating-linear-gradient(90deg, rgba(255,255,255,0.9) 0 22px, transparent 22px 40px);
        background-size: 40px 6px; animation: sp-lane 0.6s linear infinite;
      }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes sp-lane { to { background-position: 40px 0; } }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-trunk, #splash .sp-other, #splash .sp-taken { animation: none; stroke-dashoffset: 0; }
        #splash .sp-head { animation: none; opacity: 1; }
        #splash .sp-lane { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="JunctionNav is starting">
      <svg class="sp-mark" viewBox="0 0 512 512" aria-hidden="true">
        <path class="sp-trunk" d="M256 448V300" />
        <path class="sp-other" d="M256 300L150 170" />
        <path class="sp-taken" d="M256 300l106-130" />
        <polygon class="sp-head" points="300,120 422,94 408,218" />
      </svg>
      <div class="sp-name">JunctionNav</div>
      <div class="sp-tag">See every split before you reach it.</div>
      <div class="sp-lane" aria-hidden="true"></div>
    </div>
    <noscript>JunctionNav needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
