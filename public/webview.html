<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JunctionNav needs an update</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; padding: 24px; box-sizing: border-box; background: #1a0d2e; color: #faf5ff; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { margin: 0 0 18px; color: #d8b4fe; max-width: 34em; }
      a { display: inline-block; padding: 12px 18px; border-radius: 12px; background: #b77bff; color: #0b0910; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Please update Android System WebView</h1>
      <p>JunctionNav draws its maps and junction views with Android System WebView, and the version on this phone is too old. Update it from the Play Store, then open JunctionNav again.</p>
      <a href="https://play.google.com/store/apps/details?id=com.google.android.webview">Open in the Play Store</a>
    </main>
  </body>
</html>
